# Sign up against the real API: create the account, prove the phone, prove the
# email, set up the new farm and its first section, land on Home signed in.
#
# Reached the long way round on purpose: a fresh install, "Try the demo farm"
# past the launch journey, then Profile -> Create account. That is the demo
# path issue #89 keeps open - a farmer can look first and sign up later.
# first_launch_setup.yaml is the other way in, straight from Auth Choice.
#
# Needs the isolated CI stack (scripts/ci-stack.sh mobile), which runs the API
# with INTEGRATIONS_MODE=fake. Its OTP provider is deterministic - 111111 for
# the phone, 222222 for email - and delivers nothing anywhere. The app itself
# has no idea the provider is fake: this is the real client, the real routes
# and a real session in the Android Keystore.
#
#   maestro test e2e/mobile/signup.yaml
#
# The form and the codes are steps/create_account.yaml; the setup screens are
# steps/first_setup.yaml. Headings are matched with '.*...*' for the reason
# online_launch.yaml gives: Android merges sibling Texts into one
# accessibility string and Maestro matches the WHOLE string. Buttons are
# matched exactly - each is its own merged button node.
appId: za.co.almanac.app
name: A farmer tries the demo, creates an account, verifies it and sets up their farm
---
- launchApp:
    clearState: true
# Unique per run, so the flow can be rerun against a stack that already holds
# an earlier run's account. Kept if a parent flow (login.yaml) already set it,
# so the parent can log back in with the same details.
- evalScript: ${output.suffix = output.suffix || String(Date.now()).slice(-7)}
# Home first, with no session: sign-up is somewhere a farmer goes, never a gate
# in front of the farm.
- runFlow: steps/try_demo_farm.yaml
- extendedWaitUntil:
    visible: '.*Hello, Sipho.*'
    timeout: 60000
- tapOn:
    id: 'nav-profile'
- tapOn: 'Create account'
- runFlow: steps/create_account.yaml
# Both proved: a session. The new account's farm has no sections, so setup
# comes next (issue #89).
- runFlow: steps/first_setup.yaml
# Home — the account's own farm from the API (GET /farms), greeted by the
# account's name, not the signed-out demo farm.
- extendedWaitUntil:
    visible: '.*Hello, Thandi.*'
    timeout: 30000
- tapOn:
    id: 'nav-profile'
- assertVisible: '.*Thandi Mokoena.*'
- scrollUntilVisible:
    element: 'Log out'
