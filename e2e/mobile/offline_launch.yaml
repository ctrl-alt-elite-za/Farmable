# Maestro flow: with the API stopped, the app must still open and say Offline.
#
# Run it against an emulator with a development build installed and no API running:
#   maestro test e2e/mobile/offline_launch.yaml
appId: za.co.almanac.app
name: App launches and reports Offline when the API is unreachable
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Almanac'
    timeout: 30000
- assertVisible:
    id: 'api-status'
- extendedWaitUntil:
    visible: 'Offline'
    timeout: 30000
