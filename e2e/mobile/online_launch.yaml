# The isolated CI API must be running before this flow starts.
appId: za.co.ctrlaltelite.farmable
name: App launches and reaches the isolated API
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Farmable'
    timeout: 30000
- assertVisible:
    id: 'api-status'
- extendedWaitUntil:
    visible: 'Online'
    timeout: 30000
