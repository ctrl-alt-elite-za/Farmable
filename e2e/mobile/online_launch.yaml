# The isolated CI API must be running before this flow starts.
appId: za.co.almanac.app
name: App launches into Home and reports Synced when the API is reachable
---
- launchApp:
    clearState: true
# Home renders from the local database, so the farm appears without waiting on
# the network. The greeting proves the seeded farm loaded, not just that some
# screen drew.
# First launch wipes app data, so the local database is created and seeded
# before anything renders. Measured at 23s on a warm local emulator with a
# debug build; CI's emulator is cold and software-rendered, so 30s was
# marginal and flaked. Only this first wait is generous — once the farm is on
# screen the connectivity chip is already there.
- extendedWaitUntil:
    visible: 'Hello, Sipho'
    timeout: 120000
- assertVisible:
    id: 'sync-status'
- extendedWaitUntil:
    visible: 'Synced'
    timeout: 30000
