name: Deploy demo backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: farmable-gcp-staging-deploy
  cancel-in-progress: false

env:
  GCP_REGION: africa-south1
  CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'farmable-backend' }}
  MIGRATION_JOB: ${{ vars.GCP_MIGRATION_JOB || 'farmable-migrate' }}

jobs:
  deploy:
    name: Deploy ${{ github.sha }} to Johannesburg
    if: ${{ vars.DEPLOY_FREEZE != 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Ahead of authentication so a protected variable that was never set names
      # itself, instead of surfacing as an opaque auth error -- or, for
      # GCP_CLOUD_SQL_INSTANCE, which nothing validated until the backup step,
      # only after an image had already been built and pushed.
      - name: Resolve deployment configuration
        id: config
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          GCP_CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
          GCP_CLOUD_SQL_CONNECTION: ${{ vars.GCP_CLOUD_SQL_CONNECTION }}
          GCP_MEDIA_BUCKET: ${{ vars.GCP_MEDIA_BUCKET }}
          GCP_DATABASE_SECRET: ${{ vars.GCP_DATABASE_SECRET }}
          GCP_GEMINI_SECRET: ${{ vars.GCP_GEMINI_SECRET }}
        run: bash infra/gcp-required-config.sh

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2
        with:
          version: '>= 494.0.0'

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build image tagged with the exact commit SHA
        env:
          IMAGE: ${{ steps.config.outputs.repository }}/backend:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          docker build --file apps/backend/Dockerfile --target runtime --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Complete Cloud SQL backup before migration
        env:
          GCP_PROJECT: ${{ steps.config.outputs.project }}
          CLOUD_SQL_INSTANCE: ${{ steps.config.outputs.sql_instance }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash infra/gcp-backup.sh

      - name: Apply approved Alembic migration
        env:
          PROJECT: ${{ steps.config.outputs.project }}
          IMAGE: ${{ steps.config.outputs.repository }}/backend:${{ github.sha }}
          SQL_CONNECTION: ${{ steps.config.outputs.sql_connection }}
          RUNTIME_ACCOUNT: ${{ steps.config.outputs.runtime_account }}
          DATABASE_SECRET: ${{ steps.config.outputs.database_secret }}
        run: |
          set -Eeuo pipefail
          gcloud run jobs deploy "$MIGRATION_JOB" \
            --project="$PROJECT" --region="$GCP_REGION" \
            --image="$IMAGE" --service-account="$RUNTIME_ACCOUNT" \
            --set-secrets="DATABASE_URL=${DATABASE_SECRET}:latest" \
            --set-env-vars="ENVIRONMENT=staging,COMMIT_SHA=${{ github.sha }}" \
            --set-cloudsql-instances="$SQL_CONNECTION" \
            --command=/app/cloudrun-migrate.sh \
            --tasks=1 --parallelism=1 --max-retries=0 --task-timeout=20m --quiet
          gcloud run jobs execute "$MIGRATION_JOB" \
            --project="$PROJECT" --region="$GCP_REGION" --wait --quiet

      - name: Deploy, verify, smoke test, and route traffic
        env:
          GCP_PROJECT: ${{ steps.config.outputs.project }}
          IMAGE: ${{ steps.config.outputs.repository }}/backend:${{ github.sha }}
          CLOUD_SQL_CONNECTION: ${{ steps.config.outputs.sql_connection }}
          RUNTIME_SERVICE_ACCOUNT: ${{ steps.config.outputs.runtime_account }}
          DATABASE_SECRET: ${{ steps.config.outputs.database_secret }}
          GEMINI_SECRET: ${{ steps.config.outputs.gemini_secret }}
          GCS_BUCKET: ${{ steps.config.outputs.media_bucket }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash infra/gcp-rollout.sh

  frozen:
    name: Deployment freeze is active
    if: ${{ vars.DEPLOY_FREEZE == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: echo "Deployment freeze is active; no image, migration, or traffic change was attempted"
