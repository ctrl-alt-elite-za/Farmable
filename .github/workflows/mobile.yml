name: mobile

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'scripts/check-test-mode.sh'
      - 'scripts/check-arcore-device.sh'
      - '.github/workflows/mobile.yml'
      - '.npmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # The app's only setting. Never add a secret here: EXPO_PUBLIC_* values are
  # inlined into the JavaScript bundle and readable by anyone holding the app.
  EXPO_PUBLIC_API_URL: http://localhost:8000
  EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}

jobs:
  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Test mode and demo mode must not both be set
        run: bash scripts/check-test-mode.sh
      - run: pnpm -C apps/mobile run typecheck
      - run: pnpm -C apps/mobile test

  ios-unsigned-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Generate the iOS project
        run: pnpm -C apps/mobile exec expo prebuild --platform ios --no-install --clean
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build without signing
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace Farmable.xcworkspace \
            -scheme Farmable \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package Farmable-unsigned.ipa
        working-directory: apps/mobile/ios
        run: |
          mkdir -p payload/Payload
          cp -R build/Build/Products/Release-iphoneos/Farmable.app payload/Payload/
          cd payload && zip -qry ../Farmable-unsigned.ipa Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farmable-ios-unsigned
          path: apps/mobile/ios/Farmable-unsigned.ipa
          if-no-files-found: error

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        run: pnpm -C apps/mobile exec expo prebuild --platform android --no-install --clean
      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farmable-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Check the Android test phone supports ARCore
        # Exits 2 with no phone attached, which is the normal case on a runner.
        continue-on-error: true
        run: bash scripts/check-arcore-device.sh
