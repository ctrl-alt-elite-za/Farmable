name: mobile

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'scripts/check-test-mode.sh'
      - 'scripts/check-arcore-device.sh'
      - 'scripts/mobile-api.mjs'
      - 'scripts/tests/mobile-api.test.mjs'
      - '.github/workflows/mobile.yml'
      - '.npmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Non-secret, phone-reachable HTTPS API URL (overrides MOBILE_API_URL repository variable)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # Device API URLs are non-secret and validated per build. No localhost release.
  EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}

jobs:
  native-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      native: ${{ steps.detect.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect native build changes
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail if the diff cannot be read; consume all output under pipefail.
          changed_files=$(git diff --name-only "$BASE_SHA...$GITHUB_SHA")
          if printf '%s\n' "$changed_files" | grep -E \
            '^(apps/mobile/|scripts/mobile-api\.mjs$|package\.json$|pnpm-lock\.yaml$|\.npmrc$|\.github/workflows/mobile\.yml$)' > /dev/null; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  mobile-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: https://api.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # Enable pnpm before any cache step tries to locate its store.
      - run: corepack enable
      - name: Check physical-device API configuration policy
        run: node --test scripts/tests/mobile-api.test.mjs
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: |
          store_path=$(pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Test mode and demo mode must not both be set
        run: bash scripts/check-test-mode.sh
      - run: pnpm -C apps/mobile run typecheck
      - run: pnpm -C apps/mobile test

  ios-unsigned-build:
    needs: native-changes
    if: needs.native-changes.outputs.native == 'true'
    # Expo SDK 57 ships SwiftPM manifests requiring Swift tools 6.2.
    # macos-15's Xcode 16.4 only provides Swift 6.1.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Configure device API URL or label compile-only artifact
        run: node scripts/mobile-api.mjs
        env:
          MOBILE_API_URL: ${{ inputs.api_url || vars.MOBILE_API_URL }}
      # Enable pnpm before any cache step tries to locate its store.
      - run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: |
          store_path=$(pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Generate the iOS project
        run: pnpm -C apps/mobile exec expo prebuild --platform ios --no-install --clean
      - name: Restore iOS build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/Pods
            apps/mobile/ios/build
          key: ${{ runner.os }}-ios-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts', 'apps/mobile/package.json') }}
          restore-keys: |
            ${{ runner.os }}-ios-
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build without signing
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace Farmable.xcworkspace \
            -scheme Farmable \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package Farmable-unsigned.ipa
        working-directory: apps/mobile/ios
        run: |
          mkdir -p payload/Payload
          cp -R build/Build/Products/Release-iphoneos/Farmable.app payload/Payload/
          cd payload && zip -qry ../Farmable-unsigned.ipa Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farmable-ios-unsigned-${{ env.MOBILE_ARTIFACT_KIND }}
          path: apps/mobile/ios/Farmable-unsigned.ipa
          if-no-files-found: error

  android-build:
    needs: native-changes
    if: needs.native-changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Configure device API URL or label compile-only artifact
        run: node scripts/mobile-api.mjs
        env:
          MOBILE_API_URL: ${{ inputs.api_url || vars.MOBILE_API_URL }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      # Enable pnpm before any cache step tries to locate its store.
      - run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: |
          store_path=$(pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        run: pnpm -C apps/mobile exec expo prebuild --platform android --no-install --clean
      - name: Restore Android build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
            apps/mobile/android/app/build
          key: ${{ runner.os }}-android-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts', 'apps/mobile/package.json') }}
          restore-keys: |
            ${{ runner.os }}-android-
      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --build-cache --parallel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farmable-android-apk-${{ env.MOBILE_ARTIFACT_KIND }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Check the Android test phone supports ARCore
        # Exits 2 with no phone attached, which is the normal case on a runner.
        continue-on-error: true
        run: bash scripts/check-arcore-device.sh
