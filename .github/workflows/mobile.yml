name: mobile

on:
  # No path filter: a workflow that never starts cannot report a required
  # check, and an unreported required check stays pending and blocks every
  # unrelated pull request. The mobile-test job gates itself on scopes
  # instead, and a skipped job is reported and counts as success.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Non-secret, phone-reachable HTTPS API URL (overrides MOBILE_API_URL repository variable)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # Device API URLs are non-secret and validated per build. No localhost release.
  BUILD_SHA: ${{ github.sha }}
  # Pinned so a Flutter release cannot change the build out from under a PR.
  FLUTTER_VERSION: 3.47.1
  # The single source of truth for the build modes: check-test-mode.sh reads
  # these, and every build below passes these same values to the compiler.
  # A --dart-define set anywhere else is a compiler flag the guard cannot
  # see, which is how it came to be checking defaults and approving builds
  # it had never been shown.
  #
  # Spelled true/false because that is the only thing Dart's
  # bool.fromEnvironment recognises. These artifacts go to real phones, so
  # neither mode belongs in them.
  TEST_MODE: 'false'
  DEMO_MODE: 'false'

jobs:
  scopes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mobile: ${{ steps.paths.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          # Checkout tests GitHub's synthetic PR merge; its first parent is the
          # actual tested base, which the event's base SHA can lag behind.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before || 'HEAD^' }}
        run: python scripts/ci_scopes.py --base "$BASE"

  native-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      native: ${{ steps.detect.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect native build changes
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail if the diff cannot be read; consume all output under pipefail.
          changed_files=$(git diff --name-only "$BASE_SHA...$GITHUB_SHA")
          if printf '%s\n' "$changed_files" | grep -E \
            '^(apps/mobile/|scripts/mobile-api\.mjs$|\.github/workflows/mobile\.yml$)' > /dev/null; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  mobile-test:
    needs: scopes
    # Fail closed: if scopes did not succeed, its outputs are absent and
    # `outputs.mobile == 'true'` is false, which used to skip this job. A
    # skipped required check is reported as success, so a broken or failed
    # scopes job would silently let mobile changes through the gate. Running
    # the full check whenever scopes did not succeed removes that hole.
    if: ${{ !cancelled() && (needs.scopes.result != 'success' || needs.scopes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup tooling
        uses: ./.github/actions/setup
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Run mobile-test
        # Runs through ci_run.py, same as every other required check, so a
        # failure produces the .ci-reports/mobile-test.json artifact the
        # reporter workflow reads and turns into a PR comment with the exact
        # local reproduction command (make mobile-checks).
        env:
          CHECK: mobile-test
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/ci_run.py "$CHECK"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ci-result-mobile-test
          path: .ci-reports/mobile-test.json
          if-no-files-found: ignore
          retention-days: 7

  ios-unsigned-build:
    needs: native-changes
    if: needs.native-changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Configure device API URL or label compile-only artifact
        run: node scripts/mobile-api.mjs
        env:
          MOBILE_API_URL: ${{ inputs.api_url || vars.MOBILE_API_URL }}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - name: Restore CocoaPods cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/Pods
          key: ${{ runner.os }}-ios-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-
      - name: Build without signing
        working-directory: apps/mobile
        run: |
          # The same two variables the guard just read, handed to the
          # compiler. Nothing else may set these defines.
          bash ../../scripts/check-test-mode.sh
          flutter build ios --release --no-codesign \
            --dart-define=API_URL="$MOBILE_API_BASE_URL" \
            --dart-define=BUILD_SHA="$BUILD_SHA" \
            --dart-define=TEST_MODE="$TEST_MODE" \
            --dart-define=DEMO_MODE="$DEMO_MODE"
      - name: Package Almanac-unsigned.ipa
        working-directory: apps/mobile
        run: |
          mkdir -p payload/Payload
          cp -R build/ios/iphoneos/Runner.app payload/Payload/
          cd payload && zip -qry ../Almanac-unsigned.ipa Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: almanac-ios-unsigned-${{ env.MOBILE_ARTIFACT_KIND }}
          path: apps/mobile/Almanac-unsigned.ipa
          if-no-files-found: error

  android-build:
    needs: native-changes
    if: needs.native-changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Configure device API URL or label compile-only artifact
        run: node scripts/mobile-api.mjs
        env:
          MOBILE_API_URL: ${{ inputs.api_url || vars.MOBILE_API_URL }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - name: Restore Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build the APK
        working-directory: apps/mobile
        # Physical test phones use ARM64. The E2E job builds its own x86_64 APK.
        run: |
          # The same two variables the guard just read, handed to the
          # compiler. Nothing else may set these defines.
          bash ../../scripts/check-test-mode.sh
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=API_URL="$MOBILE_API_BASE_URL" \
            --dart-define=BUILD_SHA="$BUILD_SHA" \
            --dart-define=TEST_MODE="$TEST_MODE" \
            --dart-define=DEMO_MODE="$DEMO_MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: almanac-android-arm64-apk-${{ env.MOBILE_ARTIFACT_KIND }}
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      - name: Check the Android test phone supports ARCore
        # Exits 2 with no phone attached, which is the normal case on a runner.
        continue-on-error: true
        run: bash scripts/check-arcore-device.sh
