name: Nightly demo backend smoke

on:
  schedule: [{ cron: '0 0 * * *' }]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Do not reconfigure the smoke job while a deployment changes the active run.
concurrency:
  group: farmable-gcp-staging-deploy
  cancel-in-progress: false

env:
  GCP_REGION: africa-south1
  CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'farmable-backend' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2
        with:
          version: '>= 494.0.0'
      - name: Resolve the revision receiving live traffic
        id: live
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: bash infra/gcp-live-config.sh
      - name: Verify the live SHA and health contract
        env:
          API_URL: ${{ steps.live.outputs.api_url }}
          COMMIT_SHA: ${{ steps.live.outputs.commit_sha }}
        run: bash infra/gcp-demo-smoke.sh
      - name: Verify outlook for every demo crop and planting month
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          CLOUD_SQL_CONNECTION: ${{ vars.GCP_CLOUD_SQL_CONNECTION }}
          DATABASE_SECRET: ${{ vars.GCP_DATABASE_SECRET }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          FORECAST_DATA_MODE: ${{ vars.FORECAST_DATA_MODE || 'disabled' }}
          API_URL: ${{ steps.live.outputs.api_url }}
          COMMIT_SHA: ${{ steps.live.outputs.commit_sha }}
        run: bash infra/gcp-outlook-smoke.sh
