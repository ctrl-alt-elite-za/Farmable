name: Nightly demo backend smoke

on:
  schedule: [{ cron: '0 0 * * *' }]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2
        with:
          version: '>= 494.0.0'
      - name: Verify the live SHA and health contract
        env:
          API_URL: ${{ vars.GCP_STAGING_URL }}
          COMMIT_SHA: ${{ vars.GCP_STAGING_SHA }}
        run: bash infra/gcp-demo-smoke.sh
