default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
        # Registered Amendment 2 forecast audit; bytes are checked by its manifest.
        exclude: ^ml/forecast/price_only_results/69dbbedc531c3d1baf8349e0b9936dc9fb17aa702d84895d31594d6a12c9b2f7/forecast_selections\.json$
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  - repo: local
    hooks:
      # Uses the workspace prettier (pinned in package.json / pnpm-lock.yaml) so
      # local hooks and CI can never format with different versions.
      - id: prettier
        name: prettier --write
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css, scss, html]
        exclude: ^(pnpm-lock\.yaml|uv\.lock)$

  - repo: local
    hooks:
      - id: eslint
        name: eslint --fix
        entry: pnpm exec eslint --fix
        language: system
        types_or: [javascript, jsx, ts, tsx]
        exclude: ^packages/api-client/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: changed-scopes
        name: lint/typecheck/test changed folders
        entry: scripts/changed-scopes.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
