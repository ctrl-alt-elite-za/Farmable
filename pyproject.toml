[project]
name = "farmable"
version = "0.0.0"
description = "Farmable monorepo tooling (root project; apps/backend/ and apps/ml-service/ have their own manifests once they exist)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8.0,<0.9.0",
    "mypy>=1.13.0,<1.14.0",
    "pre-commit>=4.0.0,<4.1.0",
    "pytest>=8.3.0,<9.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/ml-service/data"]

[tool.ruff.lint]
# S = flake8-bandit, extra layer alongside scripts/check-no-raw-sql.sh.
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use `assert` (S101 is flake8-bandit's production rule).
"**/test_*.py" = ["S101"]
"**/*_test.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["apps/ml-service/data"]

[tool.uv]
package = false
