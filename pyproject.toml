[project]
name = "farmable"
version = "0.0.0"
description = "Farmable monorepo tooling (root project; backend/ and ml/ have their own manifests once they exist)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8.0,<0.9.0",
    "mypy>=1.13.0,<1.14.0",
    "pre-commit>=4.0.0,<4.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["ml/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["ml/data"]

[tool.uv]
package = false
