[project]
name = "farmable"
version = "0.0.0"
description = "Farmable monorepo tooling (root project; backend/ and ml/ have their own manifests once they exist)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8.0,<0.9.0",
    "mypy>=1.13.0,<1.14.0",
    "pre-commit>=4.0.0,<4.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["ml/data"]

[tool.ruff.lint]
# S = flake8-bandit: catches some SQL-injection-shaped code (e.g. S608
# string-built queries) as an extra layer alongside scripts/check-no-raw-sql.sh,
# which is the actual enforcer of #2/#3's "ORM only, no hand-written SQL" rule.
select = ["E", "F", "I", "UP", "B", "S"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["ml/data"]

[tool.uv]
package = false
