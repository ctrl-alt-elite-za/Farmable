[project]
name = "farmable-ml"
version = "0.1.0"
description = "Offline reference-data and forecasting tools for Farmable"
requires-python = ">=3.12"
dependencies = [
    "lightgbm==4.7.0",
    "numpy==2.5.3",
    "pyarrow==25.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farmable_ml"]
