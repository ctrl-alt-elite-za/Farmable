[project]
name = "farmable-backend"
version = "0.1.0"
description = "Farmable API and background worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<2.1",
    "geoalchemy2>=0.17,<1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "procrastinate>=3.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farmable_backend", "src/app"]
