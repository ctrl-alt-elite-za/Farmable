[project]
name = "farmable-backend"
version = "0.1.0"
description = "Farmable API and background worker"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<24",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "boto3>=1.35,<2",
    "Pillow>=12.3,<13",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<2.1",
    "geoalchemy2>=0.17,<1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "procrastinate>=3.2,<4",
    "httpx>=0.28,<0.29",
    "google-cloud-storage>=3.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farmable_backend", "src/app"]
